version: '3.8'

services:
  medical-rag-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medical-rag-fde-service
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - ENVIRONMENT=production
      - LLM_MODEL_NAME=llama-3.3-70b-versatile
      - TOP_K_RETRIEVAL=10
      - TOP_K_RERANK=4
      - LANGCHAIN_TRACING_V2=true
      - LANGCHAIN_PROJECT=medical-chatbot-rag-fde
    volumes:
      - ./chroma_db:/app/chroma_db
      - ./medical_chat.db:/app/medical_chat.db
    restart: unless-stopped
